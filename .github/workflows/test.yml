name: test

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bd_test
          POSTGRES_PASSWORD: bd_test
          POSTGRES_DB: bitcoindeepa_dca
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bd_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: bun run test
      - run: bun run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://bd_test:bd_test@localhost:5432/bitcoindeepa_dca
          TEST_REDIS_URL: redis://localhost:6379
